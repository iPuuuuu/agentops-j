services:
  agentops-j:
    build:
      context: .
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    environment:
      AGENTOPS_REDIS_URL: redis://redis:6379
    ports:
      - "8080:8080"
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
