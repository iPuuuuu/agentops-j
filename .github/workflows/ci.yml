name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Compile
        run: mkdir -p out && javac -d out $(find src/main/java src/test/java -name '*.java')
      - name: Test
        run: java -ea -cp out com.ipuuuuu.agentops.AgentOpsApplicationTest
